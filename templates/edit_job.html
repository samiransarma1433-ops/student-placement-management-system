<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Job - Placement Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('coordinator_dashboard') }}"
        >
            🎓 Placement Management System
        </a>

        <a
            href="{{ url_for('job_list') }}"
            class="btn btn-outline-light btn-sm"
        >
            Back to Jobs
        </a>

    </div>

</nav>


<!-- MAIN -->

<div class="container py-5">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h3 class="fw-bold mb-4">
                ✏️ Edit Placement Drive
            </h3>


            <form
                method="POST"
                action="{{ url_for('edit_job', job_id=job.id) }}"
            >

                <!-- COMPANY -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Company
                    </label>

                    <select
                        name="company_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Company
                        </option>

                        {% for company in companies %}

                            <option
                                value="{{ company.id }}"
                                {% if company.id == job.company_id %}
                                    selected
                                {% endif %}
                            >
                                {{ company.name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- ROLE -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Job Role
                    </label>

                    <input
                        type="text"
                        name="role"
                        class="form-control"
                        value="{{ job.role }}"
                        required
                    >

                </div>


                <!-- JOB TYPE -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Job Type
                    </label>

                    <select
                        name="job_type"
                        class="form-select"
                    >

                        <option
                            value="Full Time"
                            {% if job.job_type == "Full Time" %}
                                selected
                            {% endif %}
                        >
                            Full Time
                        </option>

                        <option
                            value="Internship"
                            {% if job.job_type == "Internship" %}
                                selected
                            {% endif %}
                        >
                            Internship
                        </option>

                        <option
                            value="Contract"
                            {% if job.job_type == "Contract" %}
                                selected
                            {% endif %}
                        >
                            Contract
                        </option>

                    </select>

                </div>


                <!-- PACKAGE -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Package (LPA)
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="package"
                        class="form-control"
                        value="{{ job.package or '' }}"
                    >

                </div>


                <!-- LOCATION -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Job Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        class="form-control"
                        value="{{ job.location or '' }}"
                    >

                </div>


                <hr class="my-4">


                <h5 class="fw-bold mb-3">
                    Eligibility Criteria
                </h5>


                <!-- CGPA -->

                <div class="mb-3">

                    <label class="form-label">
                        Minimum CGPA
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="min_cgpa"
                        class="form-control"
                        value="{{ job.min_cgpa }}"
                        required
                    >

                </div>


                <!-- 10TH -->

                <div class="mb-3">

                    <label class="form-label">
                        Minimum 10th Percentage
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="min_10th"
                        class="form-control"
                        value="{{ job.min_10th }}"
                        required
                    >

                </div>


                <!-- 12TH -->

                <div class="mb-3">

                    <label class="form-label">
                        Minimum 12th Percentage
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="min_12th"
                        class="form-control"
                        value="{{ job.min_12th }}"
                        required
                    >

                </div>


                <!-- BRANCH -->

                <div class="mb-3">

                    <label class="form-label">
                        Eligible Branches
                    </label>

                    <input
                        type="text"
                        name="eligible_branches"
                        class="form-control"
                        value="{{ job.eligible_branches }}"
                        required
                    >

                    <div class="form-text">
                        Example: CSE, ECE, EEE, IE
                    </div>

                </div>


                <!-- GRADUATION YEAR -->

                <div class="mb-3">

                    <label class="form-label">
                        Graduation Year
                    </label>

                    <input
                        type="number"
                        name="graduation_year"
                        class="form-control"
                        value="{{ job.graduation_year }}"
                        required
                    >

                </div>


                <!-- SKILLS -->

                <div class="mb-3">

                    <label class="form-label">
                        Required Skills
                    </label>

                    <input
                        type="text"
                        name="required_skills"
                        class="form-control"
                        value="{{ job.required_skills or '' }}"
                    >

                    <div class="form-text">
                        Example: C++, SQL, Python
                    </div>

                </div>


                <!-- DESCRIPTION -->

                <div class="mb-3">

                    <label class="form-label">
                        Job Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                    >{{ job.description or '' }}</textarea>

                </div>


                <!-- SELECTION PROCESS -->

                <div class="mb-3">

                    <label class="form-label">
                        Selection Process
                    </label>

                    <textarea
                        name="selection_process"
                        class="form-control"
                        rows="4"
                    >{{ job.selection_process or '' }}</textarea>

                </div>


                <!-- DEADLINE -->

                <div class="mb-4">

                    <label class="form-label">
                        Application Deadline
                    </label>

                    <input
                        type="date"
                        name="deadline"
                        class="form-control"
                        value="{{ job.deadline }}"
                    >

                </div>


                <!-- BUTTONS -->

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        💾 Update Job
                    </button>

                    <a
                        href="{{ url_for('job_list') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
