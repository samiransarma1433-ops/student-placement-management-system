<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>T&P Coordinator Registration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="bg-light">

<div class="container">

    <div
        class="row justify-content-center align-items-center"
        style="min-height: 100vh;"
    >

        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            T&P Coordinator Registration
                        </h2>

                        <p class="text-muted">
                            Create your coordinator account
                        </p>

                    </div>


                    <!-- Flash Messages -->

                    {% with messages = get_flashed_messages(
                        with_categories=true
                    ) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div
                                    class="alert alert-{{ category }}"
                                >
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <!-- Registration Form -->

                    <form
                        method="POST"
                        action="{{ url_for('coordinator_register') }}"
                    >

                        <!-- Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter coordinator email"
                                required
                            >

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Minimum 6 characters"
                                required
                            >

                        </div>


                        <!-- Confirm Password -->

                        <div class="mb-4">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Re-enter your password"
                                required
                            >

                        </div>


                        <!-- Register -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Create Coordinator Account
                        </button>

                    </form>


                    <!-- Login -->

                    <div class="text-center mt-4">

                        <p class="mb-0">

                            Already have an account?

                            <a
                                href="{{ url_for('coordinator_login') }}"
                                class="text-decoration-none fw-semibold"
                            >
                                Login here
                            </a>

                        </p>

                    </div>


                    <!-- Home -->

                    <div class="text-center mt-3">

                        <a
                            href="{{ url_for('home') }}"
                            class="text-muted text-decoration-none"
                        >
                            ← Back to Home
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>

</html>
