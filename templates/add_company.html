<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Company</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="{{ url_for('coordinator_dashboard') }}"
            >
                Placement Management System
            </a>

            <a
                href="{{ url_for('logout') }}"
                class="btn btn-outline-light"
            >
                Logout
            </a>

        </div>

    </nav>


    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="mb-4">
                            Add Company
                        </h2>


                        <!-- Flash Messages -->

                        {% with messages = get_flashed_messages(with_categories=true) %}

                            {% for category, message in messages %}

                                <div
                                    class="alert alert-{{ category }}"
                                    role="alert"
                                >
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endwith %}


                        <form
                            method="POST"
                            action="{{ url_for('add_company') }}"
                        >

                            <!-- Company Name -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Company Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="e.g. Tata Consultancy Services"
                                    required
                                >

                            </div>


                            <!-- Location -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Location
                                </label>

                                <input
                                    type="text"
                                    name="location"
                                    class="form-control"
                                    placeholder="e.g. Bangalore"
                                >

                            </div>


                            <!-- Website -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Company Website
                                </label>

                                <input
                                    type="url"
                                    name="website"
                                    class="form-control"
                                    placeholder="https://www.example.com"
                                >

                            </div>


                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Add Company
                                </button>

                                <a
                                    href="{{ url_for('company_list') }}"
                                    class="btn btn-secondary"
                                >
                                    View Companies
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
